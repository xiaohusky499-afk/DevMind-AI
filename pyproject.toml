[project]
name = "devmind-ai"
version = "0.1.0"
description = "企业内部技术知识库智能问答系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "websockets>=15.0.1",
    "asyncpg>=0.30.0",
    "redis>=8.0.0",
    "pymilvus>=3.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
    "torch>=2.0",
    "flagembedding>=1.4.0",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.14.3",
    "unstructured>=0.22.31",
    "langchain>=1.3.4",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.41.0",
    "dashscope>=1.25.21",
    "jieba>=0.42.1",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "python-json-logger>=4.1.0",
    "PyJWT>=2.8.0",
    "milvus-model>=0.2.12",
    "py2neo>=2021.2.4",
    "minio>=7.2.20",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "locust>=2.40.0",
    "pytest>=8.0.0",
    "ragas==0.3.0",
    "ruff>=0.16.4",
]
