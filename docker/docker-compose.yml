# =============================================================================
# DevMind-AI 一体化 docker-compose
# 合并：docker/base_app + docker/milvus_redis
# 包含：PostgreSQL 16 / Redis / etcd / MinIO / Milvus / Neo4j
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 业务数据库
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: devmind_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internal_tech_kb}
      POSTGRES_USER: ${POSTGRES_USER:-devmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; see .env.example}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devmind} -d ${POSTGRES_DB:-internal_tech_kb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2
    container_name: devmind_redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - devmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ClamAV（上传文件病毒扫描；后端生产环境必须启用 CLAMAV_ENABLED）
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    container_name: devmind_clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - devmind_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # etcd（Milvus 依赖）
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: devmind_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    ports:
      - "127.0.0.1:12379:2379"
    command: etcd --data-dir=/etcd --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://etcd:2379
    networks:
      - devmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO（Milvus 对象存储依赖）
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z-cpuv1
    container_name: devmind_minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env; see .env.example}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env; see .env.example}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - devmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Milvus 向量数据库
  # ---------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: devmind_milvus
    depends_on:
      - etcd
      - minio
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env; see .env.example}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env; see .env.example}
      ETCD_AUTO_COMPACTION_RETENTION: "0"
      MILVUS_LOG_LEVEL: info
    command: ["milvus", "run", "standalone"]
    networks:
      - devmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Neo4j 图数据库
  # 注意：Neo4j 官方镜像初始超级用户固定为 neo4j，不能用环境变量改成 root
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: devmind_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env; see .env.example}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7474:7474"   # HTTP
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - devmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 后端应用服务（backend，端口 15200）
  # 待 backend/Dockerfile 就绪后取消注释即可
  # ---------------------------------------------------------------------------
  # backend:
  #   build:
  #     context: ../backend
  #   container_name: devmind_backend
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: "5432"
  #     POSTGRES_USER: ${POSTGRES_USER:-devmind}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in .env}
  #     POSTGRES_DB: ${POSTGRES_DB:-internal_tech_kb}
  #     REDIS_HOST: redis
  #     REDIS_PORT: "6379"
  #     NEO4J_URI: bolt://neo4j:7687
  #     NEO4J_USER: neo4j
  #     NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set in .env}
  #   ports:
  #     - "127.0.0.1:15200:15200"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - devmind_network
  #   restart: unless-stopped

networks:
  devmind_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
  neo4j_data:
    driver: local
  clamav_data:
    driver: local
